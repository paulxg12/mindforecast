[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mindforecast"
version = "0.1.0"
description = "Forecast global mental-health prevalence to 2030, and classify SDSS objects with SkyClass"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Prince Raymond Paul", email = "166915752+paulxg12@users.noreply.github.com" }]
keywords = ["forecasting", "mental-health", "astronomy", "classification", "scikit-learn"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Same pins as requirements.txt, which stays the canonical environment for the
# numbers in the README. Loosening them would mean re-running every result.
dependencies = [
    "kagglehub==1.0.3",
    "pandas==3.1.1",
    "numpy==2.5.5",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
    "matplotlib==3.11.2",
]

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[project.scripts]
mindforecast = "mindforecast.cli:main"
skyclass = "skyclass.cli:main"

[project.urls]
Homepage = "https://github.com/paulxg12/mindforecast"
Issues = "https://github.com/paulxg12/mindforecast/issues"

[tool.setuptools]
packages = ["mindforecast", "skyclass"]

[tool.setuptools.package-dir]
skyclass = "skyclass/skyclass"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Default rule set (E4, E7, E9, F). E501 stays off: the report builders use long
# single-expression formatting on purpose.
select = ["E4", "E7", "E9", "F"]
